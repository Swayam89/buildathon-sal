<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corporate AI, inside</title>
  <meta name="description" content="Corporate AI, inside: every floor, every agent, every task, and the rails that hold them.">
  <meta name="theme-color" content="#03050a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <canvas id="scene" aria-label="3D view of the Corporate AI building"></canvas>

  <header class="bar">
    <a class="brand" href="landing/">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Corporate AI</span>
    </a>
    <span class="crumb" id="crumb"></span>
    <div class="status">
      <span class="pill"><b id="s-working">0</b> working now</span>
      <span class="pill">Today <b id="s-steps">0</b> steps</span>
      <span class="pill"><b id="s-outreach">0</b> verified outreach</span>
      <span class="pill alert"><b id="s-rails">0</b> rails blocked</span>
      <span class="pill brain" id="s-brain"></span>
      <label class="pill toggle"><input type="checkbox" id="autopilot"> Autopilot</label>
      <button class="cta" id="step">Run one step</button>
    </div>
  </header>

  <nav class="rail" aria-label="Floors">
    <ol id="levels"></ol>
  </nav>

  <aside class="panel" id="panel" hidden>
    <button class="back" id="back">Building</button>
    <div id="panel-body"></div>
  </aside>

  <p class="ticker" id="ticker">Drag to turn the building. Click a floor, or pick one from the list, to go in.</p>

  <dialog id="modal">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="modal-body"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
